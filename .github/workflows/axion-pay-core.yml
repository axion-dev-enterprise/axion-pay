name: AXION Pay Core

on:
  pull_request:
    paths:
      - 'packages/axion-pay-core/**'
      - '.github/workflows/axion-pay-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/axion-pay-core/**'
      - '.github/workflows/axion-pay-core.yml'

jobs:
  verify-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/axion-pay-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/axion-pay-core/pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
