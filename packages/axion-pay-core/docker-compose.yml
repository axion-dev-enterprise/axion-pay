services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axion}
      POSTGRES_DB: axion_pay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_pay"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - axion_pg:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - axion_redis:/data

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://axion:${POSTGRES_PASSWORD:-axion}@postgres:5432/axion_pay
      REDIS_URL: redis://redis:6379
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp

volumes:
  axion_pg:
  axion_redis:
